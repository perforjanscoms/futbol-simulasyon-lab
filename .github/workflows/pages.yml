name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site files
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
      - name: Fetch public club Elo ratings
        run: |
          curl -fsSL --retry 3 --retry-delay 2 --max-time 90 "https://public-api.beyondelo.com/v1/datasets/club-ratings.csv" -o _site/club-ratings.csv || printf 'name,elo,as_of\n' > _site/club-ratings.csv
      - name: Fetch public national-team Elo ratings
        run: |
          curl -fsSL --retry 3 --retry-delay 2 --max-time 90 "https://worldcupelo.com/api/rankings" -o _site/national-ratings.json || printf '{"teams":[]}\n' > _site/national-ratings.json
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
