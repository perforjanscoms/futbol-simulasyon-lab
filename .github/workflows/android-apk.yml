name: Build BYBORA Market Desk APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'piyasa-terminal/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bybora-android-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle --no-daemon --stacktrace -p android-app assembleDebug

      - name: Prepare download file
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk BYBORA-Market-Desk.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BYBORA-Market-Desk-APK
          path: BYBORA-Market-Desk.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="bybora-market-desk-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" BYBORA-Market-Desk.apk             --title "BYBORA Market Desk APK · Build ${GITHUB_RUN_NUMBER}"             --notes "Installable Android APK. Bundled BYBORA interface; TradingView charts and market data require internet access."             --latest
